name: Build

on:
  push:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        run: mise install

      - name: Build
        shell: bash
        run: |
          cd backend && uv sync && uv pip install pyinstaller
          cd ../frontend && bun install && bun run build
          cd ../backend && uv run pyinstaller ocr-camera.spec --noconfirm --distpath ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Camera-Windows
          path: dist/OCR-Camera.exe
