name: Build

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        shell: powershell
        run: |
          mise install
          Push-Location backend
          mise exec -- uv sync
          mise exec -- uv pip install pyinstaller
          Pop-Location
          Push-Location frontend
          mise exec -- bun install
          mise exec -- bun run build
          Pop-Location
          Push-Location backend
          mise exec -- uv run pyinstaller ocr-camera.spec --noconfirm --distpath ../dist
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Camera-Windows
          path: dist/OCR-Camera.exe

      - name: Attach artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/OCR-Camera.exe --clobber
