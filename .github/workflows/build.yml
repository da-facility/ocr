name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: OCR-Camera.exe
          - os: ubuntu-latest
            artifact: OCR-Camera
          - os: macos-latest
            artifact: OCR-Camera
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build
        shell: bash
        run: |
          cd backend && uv sync && uv pip install pyinstaller
          cd ../frontend && bun install && bun run build
          cd ../backend && uv run pyinstaller ocr-camera.spec --noconfirm --distpath ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Camera-${{ runner.os }}
          path: dist/${{ matrix.artifact }}
