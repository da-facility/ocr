name: Build

on:
  push:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: |
          mise install
          Push-Location backend
          mise exec -- uv sync
          mise exec -- uv pip install pyinstaller
          Pop-Location
          Push-Location frontend
          mise exec -- bun install
          mise exec -- bun run build
          Pop-Location
          Push-Location backend
          mise exec -- uv run pyinstaller ocr-camera.spec --noconfirm --distpath ../dist
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: OCR-Camera-Windows
          path: dist/OCR-Camera.exe
