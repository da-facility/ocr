name: Python Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "python rewrite/**"
      - ".github/workflows/python-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r "python rewrite/requirements.txt"
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "OCR Console Python" `
            --collect-all cv2 `
            --collect-all numpy `
            --collect-all PIL `
            --hidden-import pytesseract `
            "python rewrite/app.py"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ocr-console-python-windows
          path: dist/OCR Console Python.exe
