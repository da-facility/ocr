[project]
name = "ocr-backend"
version = "0.1.0"
description = "OCR camera stream backend with FastAPI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "opencv-python>=4.8.0",
    "cv2-enumerate-cameras",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "sessions", "camera", "processing", "ocr", "glyphs"]

[dependency-groups]
dev = ["pyinstaller>=6.0.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
