[project]
name = "ocr-backend"
version = "0.1.0"
description = "OCR camera stream backend with FastAPI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "opencv-python>=4.8.0",
    "cv2-enumerate-cameras",
    "easyocr>=1.7.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "sessions", "camera", "processing", "ocr", "glyphs"]

[tool.uv]
dev-dependencies = []
